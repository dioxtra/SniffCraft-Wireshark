name: Watch upstream

# Weekly check of the projects this fork follows, opens (or updates) an issue when something needs to be merged
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  sniffcraft:
    name: New SniffCraft commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List the upstream commits missing here
        id: commits
        run: |
          git fetch --quiet https://github.com/adepierre/SniffCraft.git master
          git log --no-merges --format='- [`%h`](https://github.com/adepierre/SniffCraft/commit/%H) %s (%as)' HEAD..FETCH_HEAD > commits.md
          echo "count=$(wc -l < commits.md)" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.commits.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.commits.outputs.count }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "adepierre/SniffCraft has $COUNT commit(s) that are not in this repository yet:"
            echo
            cat commits.md
            echo
            echo 'Merge them with `git fetch upstream && git merge upstream/master`. New Minecraft versions also go in `tools/build_versions.py` and in the version request issue template.'
            echo
            echo "_Updated by the [Watch upstream](https://github.com/$REPO/actions/workflows/watch_upstream.yml) workflow._"
          } > body.md
          title="Upstream SniffCraft has new commits"
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --title "$title" --body-file body.md
          fi

  minecraft_data:
    name: New minecraft-data definitions
    runs-on: ubuntu-latest
    permissions:
      # Push the update branch
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Regenerate the definitions from the latest minecraft-data
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api repos/PrismarineJS/minecraft-data/commits/master --jq .sha)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          sed -i "s/^DEFAULT_REF = \".*\"$/DEFAULT_REF = \"$ref\"/" tools/gen_mcdata.py
          python3 tools/gen_mcdata.py
          # Most minecraft-data commits don't change the protocol, then only the generator comments differ
          git add --intent-to-add wireshark/minecraft_mcdata
          if git diff --quiet -I '^-- Generated by' -- wireshark/minecraft_mcdata; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Wireshark
        if: steps.generate.outputs.changed == 'true'
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable || true
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Run the dissector tests
        id: tests
        if: steps.generate.outputs.changed == 'true'
        run: |
          set -o pipefail
          if python3 tests/run_tests.py --install 2>&1 | tee tests.log; then
            result=passed
          elif python3 tests/run_tests.py --install --update 2>&1 | tee -a tests.log; then
            # The new definitions change the dissection, the branch has the new expected output to review
            result=changed
          else
            result=failed
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Push the update branch and open or update the tracking issue
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.generate.outputs.ref }}
          RESULT: ${{ steps.tests.outputs.result }}
          REPO: ${{ github.repository }}
        run: |
          branch="auto/minecraft-data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/gen_mcdata.py wireshark/minecraft_mcdata tests/expected
          git commit --quiet -m "Update the minecraft-data definitions to ${REF:0:10}"
          git push --force origin "$branch"
          case "$RESULT" in
            passed) tests="The dissector tests pass with the new definitions." ;;
            changed) tests="The dissection of the test captures changed, review \`tests/expected\` in the branch." ;;
            *) tests="**The dissector tests fail with the new definitions**, see the [workflow run](https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID)." ;;
          esac
          {
            echo "PrismarineJS/minecraft-data@$REF has new protocol definitions, they were regenerated in the [\`$branch\`](https://github.com/$REPO/compare/master...$branch?expand=1) branch."
            echo
            echo "$tests"
            echo
            echo '```'
            git diff --stat HEAD~1 | tail -n 20
            echo '```'
            echo
            echo "_Updated by the [Watch upstream](https://github.com/$REPO/actions/workflows/watch_upstream.yml) workflow._"
          } > body.md
          title="New minecraft-data protocol definitions"
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --title "$title" --body-file body.md
          fi
