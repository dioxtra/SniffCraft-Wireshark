name: Dissector tests

on:
  push:
    branches:
      - master
    paths:
      - 'wireshark/**'
      - 'tests/**'
      - 'tools/gen_mcdata.py'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'wireshark/**'
      - 'tests/**'
      - 'tools/gen_mcdata.py'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
  # Also run before each release
  workflow_call:

permissions:
  contents: read

jobs:
  dissectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Wireshark
        run: |
          # Ubuntu's own package can be older than the 4.4 the dissectors need
          sudo add-apt-repository -y ppa:wireshark-dev/stable || true
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n1

      - name: Check the dissectors against the test captures
        run: python3 tests/run_tests.py --install
